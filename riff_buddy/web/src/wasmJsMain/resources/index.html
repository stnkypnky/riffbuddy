<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#241F1B">
  <title>Riff Buddy</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    html, body { margin: 0; height: 100%; background: #241F1B; overflow: hidden; overscroll-behavior: none; }
    /* alphaTab's cursors and loop, warm amber as on the phone. */
    .at-cursor-bar { background: rgba(232, 154, 46, 0.22); }
    .at-cursor-beat { background: rgba(194, 94, 16, 0.78); width: 3px; }
    .at-selection div { background: rgba(232, 154, 46, 0.25); }
    .at-highlight * { fill: #C25E10; stroke: #C25E10; }

    /*
     * The splash, shown while the app downloads and opens its storage, so the
     * first thing seen is the app rather than an empty page. It sits above the
     * app's canvas and fades out when the app has started (rbSplash.done).
     * The colors are the default Sunburst finish's; the chosen finish lives in
     * the app's database, which isn't open yet.
     */
    @font-face {
      font-family: "Barlow Condensed";
      src: url("fonts/BarlowCondensed-SemiBold.ttf") format("truetype");
      font-weight: 600;
      font-display: swap;
    }
    #rb-splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      background: radial-gradient(ellipse at 50% 38%, #3A2E22 0%, #241F1B 62%);
      color: #F7F0E4;
      font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
      transition: opacity 280ms ease-out, visibility 0s linear 280ms;
    }
    #rb-splash.rb-done { opacity: 0; visibility: hidden; }
    #rb-splash img {
      width: 112px; height: 112px; border-radius: 26px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 180, 61, 0.18);
    }
    #rb-splash .rb-name { font-size: 40px; font-weight: 600; letter-spacing: 0.2px; color: #FFB43D; line-height: 1; }
    #rb-splash .rb-line { font-family: system-ui, sans-serif; font-size: 14px; color: #CBBFAC; }
    /* A thin track with a light sweeping across it: says "working" without a spinner's urgency. */
    #rb-splash .rb-track {
      position: relative; overflow: hidden; width: 140px; height: 3px; border-radius: 3px;
      background: #40372E; margin-top: 4px;
    }
    #rb-splash .rb-track::after {
      content: ""; position: absolute; top: 0; left: 0; height: 100%; width: 40%; border-radius: 3px;
      background: linear-gradient(90deg, transparent, #FFB43D, transparent);
      animation: rb-sweep 1.3s ease-in-out infinite;
    }
    @keyframes rb-sweep { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    /* Asked for less motion: the track stays, lit, and nothing moves. */
    @media (prefers-reduced-motion: reduce) {
      #rb-splash { transition: none; }
      #rb-splash .rb-track::after { animation: none; width: 100%; opacity: 0.55; }
    }
  </style>
  <script>
    // Called by the app once it has started, or once it has a problem to
    // show, which it draws on its own canvas underneath this.
    window.rbSplash = {
      done: function () {
        var el = document.getElementById("rb-splash");
        if (!el) return;
        el.classList.add("rb-done");
        setTimeout(function () { el.remove(); }, 400);
      },
    };
  </script>
  <script src="audio-bridge.js"></script>
  <script src="db-bridge.js"></script>
  <script src="files-bridge.js"></script>
  <script src="keys-bridge.js"></script>
  <script src="platform-bridge.js"></script>
  <script src="pwa-bridge.js"></script>
  <script src="alphatab/alphaTab.js"></script>
  <script src="tabs-bridge.js"></script>
  <script type="application/javascript" src="riffbuddy.js"></script>
</head>
<body>
  <div id="rb-splash" role="status" aria-live="polite">
    <img src="icons/icon-192.png" alt="">
    <div class="rb-name">Riff Buddy</div>
    <div class="rb-track" aria-hidden="true"></div>
    <div class="rb-line">Tuning up…</div>
  </div>
</body>
</html>
