# Shared version catalog. Every app module references these, so bumping a
# version here updates all apps at once.
[versions]
agp = "9.4.0"
kotlin = "2.4.10"
composeBom = "2026.08.00"
coreKtx = "1.19.0"
activityCompose = "1.13.0"
lifecycleRuntimeKtx = "2.11.0"
navigationCompose = "2.10.0"
okhttp = "5.5.0"
libphonenumber = "9.0.39"
libphonenumberCarrier = "2.39"
libphonenumberGeocoder = "3.39"
jsoup = "1.23.2"
junit = "4.13.2"
jsonJvm = "20250517"
alphaTab = "1.8.4"
sqliteJdbc = "3.53.4.0"
# Riff Buddy's desktop edition. Pairs with Kotlin 2.4.x and the Compose 1.12 in the BOM.
composeMultiplatform = "1.12.1"
# alphaTab 1.8.4's own drawing engine. The desktop needs it named, with one
# platform's native library; Android gets it through the alphaTab AAR.
alphaSkia = "3.4.135"
# The desktop edition's API-key store: the OS keychain on each platform.
javaKeyring = "1.0.4"
# Calls into the C library (setenv) for the desktop edition's font setup on Linux.
jna = "5.17.0"
javamp3 = "1.0.1"
# Dispatchers.Main on the desktop is the Swing event thread.
coroutines = "1.10.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
# Phone metadata, resolved offline from bundled tables — carrier and geocoder
# are versioned separately from the core library and always will be.
libphonenumber = { group = "com.googlecode.libphonenumber", name = "libphonenumber", version.ref = "libphonenumber" }
libphonenumber-carrier = { group = "com.googlecode.libphonenumber", name = "carrier", version.ref = "libphonenumberCarrier" }
libphonenumber-geocoder = { group = "com.googlecode.libphonenumber", name = "geocoder", version.ref = "libphonenumberGeocoder" }
# HTML parsing for county assessor pages.
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# Android stubs org.json in unit tests and every call returns null. The real
# implementation on the test classpath is what lets adapters be tested at all.
json-jvm = { group = "org.json", name = "json", version.ref = "jsonJvm" }
# Guitar Pro / MusicXML / alphaTex rendering and SoundFont playback. The spec's
# choice for the spec; this is its native Kotlin build, not the JavaScript one.
alphatab = { group = "net.alphatab", name = "alphaTab", version.ref = "alphaTab" }
alphaskia = { group = "net.alphatab", name = "alphaSkia", version.ref = "alphaSkia" }
alphaskia-linux = { group = "net.alphatab", name = "alphaSkia-linux", version.ref = "alphaSkia" }
alphaskia-windows = { group = "net.alphatab", name = "alphaSkia-windows", version.ref = "alphaSkia" }
alphaskia-macos = { group = "net.alphatab", name = "alphaSkia-macos", version.ref = "alphaSkia" }
java-keyring = { group = "com.github.javakeyring", name = "java-keyring", version.ref = "javaKeyring" }
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
javamp3 = { group = "fr.delthas", name = "javamp3", version.ref = "javamp3" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }
# Test-only: a real SQLite on the JVM, so migrations can be run against a
# fixture database instead of only being read. Never shipped.
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqliteJdbc" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
